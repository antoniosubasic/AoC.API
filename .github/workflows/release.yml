name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  # Opens or updates a "chore: release vX.Y.Z" pull request holding the version
  # bump and the generated changelog, and - once that pull request lands - tags
  # vX.Y.Z and creates the GitHub release. Nothing is committed to main
  # directly, and PackageVersion is never edited by hand.
  #
  # It authenticates with a personal access token rather than the default
  # GITHUB_TOKEN where one is available, because GitHub refuses to start a
  # workflow run from an event created by the default token, which would leave
  # the release pull request without a CI run.
  release-pr:
    name: Release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release-please.outputs.release_created }}
      tag: ${{ steps.release-please.outputs.tag_name }}
      version: ${{ steps.release-please.outputs.version }}
    steps:
      - name: Run release-please
        id: release-please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only reached on the push that merged a release pull request, which is the
  # commit release-please just tagged - so the default checkout is the release.
  publish:
    name: Publish to NuGet
    needs: release-pr
    if: needs.release-pr.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: dotnet pack -c Release -o artifacts

      # release-please updates PackageVersion through the manifest, and an
      # xpath that stopped matching would fail silently - shipping the previous
      # version under the new tag. Refuse to publish rather than let that go
      # unnoticed.
      - name: Check the package version matches the release
        env:
          VERSION: ${{ needs.release-pr.outputs.version }}
        run: |
          if [ ! -f "artifacts/AoCAPI.$VERSION.nupkg" ]; then
            echo "expected artifacts/AoCAPI.$VERSION.nupkg, found:" >&2
            ls -1 artifacts >&2
            exit 1
          fi

      - name: Publish
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
